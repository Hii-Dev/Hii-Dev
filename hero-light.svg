<svg xmlns="http://www.w3.org/2000/svg" width="840" height="220" viewBox="0 0 840 220" role="img" aria-label="Hi there, I&#x27;m Hii — Programmer based in Chiba, Japan">
<title>Hi there, I&#x27;m Hii — Programmer based in Chiba, Japan</title>
<defs>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#4f46e5"/><stop offset="1" stop-color="#c026d3"/>
  </linearGradient>
</defs>
<style>
  text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; fill: #1f2328; }
  .heading { font-size: 14px; font-weight: 600; }
  .muted { font-size: 12px; fill: #59636e; }
  .small { font-size: 11px; }
  .fade { animation: fade .8s ease-out both; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } }
  
  .name { font-size: 56px; font-weight: 700; letter-spacing: -1.5px; fill: url(#accent); }
  .code { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 12.5px; white-space: pre; }
  .cursor { animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<rect x="0.5" y="0.5" width="839" height="219" rx="14" fill="#ffffff" stroke="#d1d9e0"/>

<defs>
  <pattern id="dots" width="16" height="16" patternUnits="userSpaceOnUse">
    <circle cx="1" cy="1" r="1" fill="#d1d9e0" opacity=".7"/>
  </pattern>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="40"/></filter>
  <clipPath id="card"><rect x="1" y="1" width="838" height="218" rx="13"/></clipPath>
</defs>
<g clip-path="url(#card)">
  <rect width="840" height="220" fill="url(#dots)"/>
  <circle cx="120" cy="40" r="90" fill="#4f46e5" opacity=".22" filter="url(#blur)"/>
  <circle cx="340" cy="200" r="80" fill="#c026d3" opacity=".16" filter="url(#blur)"/>
</g>
<text x="40" y="84" class="muted fade" style="font-size:15px">Hi there, I'm</text>
<text x="36" y="136" class="name fade" style="animation-delay:.1s">Hii</text>
<text x="40" y="170" class="muted fade" style="font-size:15px;animation-delay:.2s">Programmer — Chiba, Japan</text>
<rect x="452" y="34" width="356" height="152" rx="10" fill="#f6f8fa" stroke="#d1d9e0" opacity=".96"/>
<circle cx="472" cy="52" r="4" fill="#d1d9e0"/><circle cx="486" cy="52" r="4" fill="#d1d9e0"/><circle cx="500" cy="52" r="4" fill="#d1d9e0"/>
<text x="472" y="84" xml:space="preserve" class="code fade" style="animation-delay:0.30s"><tspan fill="#cf222e">const </tspan><tspan fill="#1f2328">hii</tspan><tspan fill="#59636e"> = {</tspan></text><text x="472" y="102" xml:space="preserve" class="code fade" style="animation-delay:0.38s"><tspan fill="#0550ae">  role</tspan><tspan fill="#59636e">: </tspan><tspan fill="#0a3069">"Programmer"</tspan><tspan fill="#59636e">,</tspan></text><text x="472" y="120" xml:space="preserve" class="code fade" style="animation-delay:0.46s"><tspan fill="#0550ae">  base</tspan><tspan fill="#59636e">: </tspan><tspan fill="#0a3069">"Chiba, Japan"</tspan><tspan fill="#59636e">,</tspan></text><text x="472" y="138" xml:space="preserve" class="code fade" style="animation-delay:0.54s"><tspan fill="#0550ae">  stack</tspan><tspan fill="#59636e">: [</tspan><tspan fill="#0a3069">"React"</tspan><tspan fill="#59636e">, </tspan><tspan fill="#0a3069">"FastAPI"</tspan><tspan fill="#59636e">],</tspan></text><text x="472" y="156" xml:space="preserve" class="code fade" style="animation-delay:0.62s"><tspan fill="#0550ae">  loves</tspan><tspan fill="#59636e">: [</tspan><tspan fill="#0a3069">"beer"</tspan><tspan fill="#59636e">, </tspan><tspan fill="#0a3069">"books"</tspan><tspan fill="#59636e">],</tspan></text><text x="472" y="174" xml:space="preserve" class="code fade" style="animation-delay:0.70s"><tspan fill="#59636e">};</tspan></text>
<rect x="492" y="163" width="7" height="14" fill="#4f46e5" class="cursor"/>

</svg>
